name: Deploy ke Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 🔧 Jalankan build aset statis (Vite) di GitHub runner
      - name: Install dependencies & build Vite
        run: |
          npm install
          npm run build

      # ⬆️ Kirim hasil public/build ke server terlebih dahulu
      - name: Upload build assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 64000
          source: "public/build"
          target: "project/ppid-konawe"

      # 💻 Jalankan Git Pull & Perintah Backend di Server
      - name: Deploy ke server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 64000
          script: |
            # Memastikan direktori project ada
            mkdir -p project
            cd project
            
            # Kloning jika repositori belum ada
            if [ ! -d "ppid-konawe/.git" ]; then
              git clone git@github.com:are-one/ppid-konawe.git ppid-konawe
            fi
            
            cd ppid-konawe
            
            # Tarik pembaruan kode terbaru dari branch main
            git pull origin main

            # Setup .env jika belum ada
            if [ ! -f ".env" ]; then
              cp .env.example .env
              php artisan key:generate
            fi

            # Install dependensi PHP/Laravel di sisi server
            composer install --optimize-autoloader --no-dev

            # Bersihkan cache lama dan cache ulang konfigurasi baru
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Jalankan migrasi database
            php artisan migrate --force
            
            # Pastikan symbolic link storage sudah aktif
            php artisan storage:link --force
