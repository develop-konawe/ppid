name: Deploy ke Server

on:
  push:
    branches:
      - main  # hanya jalan kalau ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      - name: Deploy ke server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 64000
          script: |
            if [ ! -d "project/absensi-backend/.git" ]; then
              echo "📦 Project belum ada, clone dari GitHub..."
              cd project
              git clone git@github.com:are-one/laravel-absensi-backend.git absensi-backend
              cd absensi-backend
            else
              echo "🔄 Project sudah ada, update dengan git pull..."
              cd project/absensi-backend
              git pull origin main
            fi

            composer install --optimize-autoloader
            php artisan key:generate
            php artisan config:cache
            php artisan route:cache
            php artisan migrate:fresh --seed
