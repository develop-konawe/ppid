name: Deploy ke Server

on:
  push:
    branches:
      - main  # hanya jalan kalau ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      - name: Deploy ke server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 64000
          script: |
            if [ ! -d "project/ppid-konawe/.git" ]; then
              echo "📦 Project belum ada, clone dari GitHub..."
              cd project
              git clone git@github.com:are-one/ppid-konawe.git ppid-konawe
              cd ppid-konawe
            else
              echo "🔄 Project sudah ada, update dengan git pull..."
              cd project/ppid-konawe
              git pull origin main
            fi

            if [ ! -f ".env" ]; then
              echo "📝 Membuat file .env..."
              cp .env.example .env
            fi

            echo "📦 Menjalankan composer..."
            composer install --optimize-autoloader --no-dev

            # 👇 Tambahan bagian Vite build
            if [ ! -d "node_modules" ]; then
              echo "📦 Menginstall dependensi npm..."
              npm ci --legacy-peer-deps
            fi

            echo "🏗️ Membangun asset dengan Vite..."
            npm run build

            echo "🚀 Menjalankan migrasi database..."
            php artisan key:generate
            php artisan config:cache
            php artisan route:cache
            php artisan migrate
