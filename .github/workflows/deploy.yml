name: Deploy ke Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      # 🔧 Jalankan build di GitHub, bukan di server
      - name: Install dependencies & build Vite
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install composer dependencies
        run: |
          composer install --optimize-autoloader --no-dev

      - name: Deploy ke server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 64000
          script: |
            if [ ! -d "project/ppid-konawe/.git" ]; then
              cd project
              git clone git@github.com:are-one/ppid-konawe.git ppid-konawe
            fi
            cd project/ppid-konawe
            git pull origin main

            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            php artisan key:generate
            php artisan config:cache
            php artisan route:cache
            php artisan migrate --force

      # ⬆️ Setelah build, kirim hasil public/build ke server
      - name: Upload build assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 64000
          source: "public/build"
          target: "project/ppid-konawe/public"
